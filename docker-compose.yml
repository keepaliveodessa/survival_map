# Docker Compose - Survival Map v3
# Architecture: Parser (kurigram) → Processor (NLP) → PostgreSQL → Core (API)

# Shared logging config — json-file с ротацией (max 50MB на сервис: 5×10MB).
# Без этого docker накапливает логи без ограничений и съедает диск.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Shared PostgreSQL credentials (единый источник для всех сервисов)
x-pg-env: &pg-env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}

# Shared DNS
x-dns: &dns
  dns:
    - 9.9.9.9
    - 1.1.1.1

services:
  # =============================================================================
  # PostgreSQL - основной storage с PostGIS
  # =============================================================================
  postgres:
    image: survival_postgres:latest
    build:
      context: .
      dockerfile: Dockerfile.postgres
      network: host
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Role-specific timeouts
      PARSER_STATEMENT_TIMEOUT: 60000
      CORE_STATEMENT_TIMEOUT: 30000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && psql -U postgres -d postgres -c 'SELECT pg_is_in_recovery()' | grep -q 'f' && psql -U postgres -d postgres -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    # NET_BIND_SERVICE — bind на 5432 (privileged port).
    # CHOWN — смена владельца data directory при инициализации.
    # SETGID/SETUID — gosu для переключения на пользователя postgres.
    # DAC_OVERRIDE — доступ к файлам data directory.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Parser - Telegram клиент (kurigram) + предобработка текста + фото
  # =============================================================================
  parser:
    image: survival_parser:latest
    build:
      context: .
      dockerfile: Dockerfile.parser
      network: host
    container_name: parser
    stop_grace_period: 60s
    environment:
      <<: *pg-env
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      # Канал для парсинга (формат -100XXXXXXXXXX). Проброс из .env (H-1):
      # без этого парсер всегда работал с fallback из common/settings.py,
      # молча игнорируя CHANNEL_ID из .env. Дефолт здесь синхронизирован с
      # fallback в settings.py: пустая строка env-переменной НЕ триггерит
      # fallback в коде (environs возвращает ''), поэтому дефолт задаётся в compose.
      CHANNEL_ID: ${CHANNEL_ID:--1002050105527}
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-1080}
      PROXY_SCHEME: ${PROXY_SCHEME:-socks5}
      PARSER_HISTORY_LIMIT: ${PARSER_HISTORY_LIMIT:-65}
    <<: *dns
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./parser/session.session:/app/parser/session.session:rw
      - events_media:/media/events:rw
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - db
    # Prometheus-метрики (start_http_server в parser/monitoring.py).
    # expose, не ports: скрейп только из docker-сети (prometheus в backend).
    expose:
      - "9100"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/parser_heartbeat && [ $$(( $$(date +%s) - $$(cat /tmp/parser_heartbeat) )) -lt 60 ]"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # NLP Processor - NLP pipeline (pymorphy3 + rapidfuzz + PostGIS)
  # =============================================================================
  nlp_processor:
    image: survival_processor:latest
    build:
      context: .
      dockerfile: Dockerfile.processor
      network: host
    container_name: nlp_processor
    stop_grace_period: 30s
    environment:
      <<: *pg-env
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    <<: *dns
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - db
    expose:
      - "8765"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8765/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    deploy:
      resources:
        limits:
          # Память: DAWG pymorphy3 (~20MB) + LRU-кэши + ONNX runtime
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Core - API сервер (опционально)
  # =============================================================================
  core:
    image: survival_core:latest
    build:
      context: .
      dockerfile: Dockerfile.core
      network: host
    container_name: core
    stop_grace_period: 30s
    environment:
      <<: *pg-env
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      BOT_TOKEN: ${BOT_TOKEN}
      # Стабильный секрет подписи JWT (≥32 симв.): токены переживают рестарт
      # core и общие для всех реплик. Если не задан — settings генерирует
      # эфемерный секрет на каждый старт (токены инвалидируются при рестарте).
      JWT_SECRET: ${JWT_SECRET}
      WEBAPP_URL: ${WEBAPP_URL:-}
      REDIRECT_URL: ${REDIRECT_URL:-}
      TELEGRAM_WEBVIEW_VALIDATION: ${TELEGRAM_WEBVIEW_VALIDATION:-true}
      PROXY_HOST: ${PROXY_HOST:-}
      PROXY_PORT: ${PROXY_PORT:-1080}
      PROXY_SCHEME: ${PROXY_SCHEME:-socks5}
    <<: *dns
    volumes:
      - events_media:/media/events:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - db
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; exit(urllib.request.urlopen('http://localhost:8080/health').status != 200)\""]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Web - reverse proxy + статика фронтенда
  # =============================================================================
  web:
    image: survival_web:latest
    build:
      context: .
      dockerfile: Dockerfile.web
      network: host
    container_name: web
    stop_grace_period: 30s
    ports:
      - "80:80"
    volumes:

      - events_media:/media/events:ro
    depends_on:
      core:
        condition: service_healthy
    networks:
      - frontend
    healthcheck:
      # busybox wget (есть в nginx:alpine); curl в образе отсутствует.
      # 127.0.0.1 вместо localhost: nginx слушает только IPv4 (listen 80),
      # а wget резолвит localhost в ::1 и получает Connection refused.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health/ready >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # NET_BIND_SERVICE — bind на 80 (privileged port).
    # CHOWN — смена владельца temp файлов nginx.
    # SETGID/SETUID — nginx worker процессы drop привилегии.
    # DAC_OVERRIDE — доступ к файлам (static content, конфиги).
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    tmpfs:
      - /var/cache/nginx:size=10m
      - /var/run:size=1m
    restart: unless-stopped
    logging: *default-logging


  # =============================================================================
  # cAdvisor - метрики контейнеров (CPU/RAM/сеть) для prometheus
  # =============================================================================
  cadvisor:
    # v0.55.1 — новейший тег, реально присутствующий в gcr.io (образы в
    # registry отстают от GitHub-релизов; проверено через /v2/tags/list).
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    profiles:
      - monitoring
    # Доступ к docker daemon и cgroup'ам хоста — единственный способ увидеть
    # ресурсное потребление всех контейнеров (parser, nlp_processor, postgres, core).
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # Читать метрики только своих контейнеров (docker), не всего etcd/crio.
    devices:
      - /dev/kmsg
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,referenced_memory,cpu_topology
    networks:
      - monitoring
    expose:
      - "8080"
    # privileged-доступов не даём: read-only монтирования + cap_drop ALL.
    # cAdvisor в контейнере работает с этим набором на stock docker host.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # postgres_exporter - PostgreSQL metrics collector
  # =============================================================================
  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres_exporter
    profiles:
      - monitoring
    environment:
      # Пароль в отдельной переменной, не в URI: не светится в pg_stat_activity
      # и в docker inspect. Начиная с v0.18 custom-queries config удалён —
      # встроенные collectors (stat_database, locks, stat_user_tables, wal,
      # bgwriter, progress_vacuum, pg_settings) покрывают базовый мониторинг.
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB:-postgres}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-postgres}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    networks:
      - db
      - monitoring
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 32M
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Prometheus - metrics storage and scraping
  # =============================================================================
  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    profiles:
      - monitoring
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    networks:
      - monitoring
      - backend
    expose:
      - "9090"
    # UI (http://localhost:9090) только на loopback хоста: наружу 9090 не
    # публикуем. Доступ с рабочей машины — ssh -L 9090:localhost:9090 <host>.
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - postgres_exporter
      - cadvisor
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 96M
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Grafana - metrics visualization
  # =============================================================================
  grafana:
    image: grafana/grafana:12.3.1
    container_name: grafana
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # JSON-дашборды для file-provisioner (provider.yml → /var/lib/grafana/dashboards)
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    expose:
      - "3000"
    # UI только на loopback хоста (как и prometheus 9090): пароль admin из .env
    # не должен уезжать в интернет вместе с ngrok-туннелем.
    # Доступ с рабочей машины — ssh -L 3000:localhost:3000 <host>.
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 192M
        reservations:
          cpus: '0.1'
          memory: 48M
    restart: unless-stopped
    logging: *default-logging

  # =============================================================================
  # Loki + Promtail — log aggregation + Docker log collector (единый контейнер).
  # Promtail встроен в Loki-образ через multi-stage Dockerfile; entrypoint.sh
  # запускает оба процесса параллельно. Падение любого → exit 1 → restart.
  # =============================================================================
  loki:
    image: survival_loki:latest
    build:
      context: .
      dockerfile: monitoring/loki/Dockerfile.loki
      network: host
    container_name: loki
    profiles:
      - monitoring
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/local-config.yaml:ro
      - ./monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - loki_data:/loki
    networks:
      - monitoring
    expose:
      - "3100"
    deploy:
      resources:
        limits:
          cpus: '0.35'
          memory: 384M
        reservations:
          cpus: '0.15'
          memory: 96M
    restart: unless-stopped
    logging: *default-logging

# Networks
# =============================================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  db:
    driver: bridge
    internal: true  # No external access
  # Изолированная сеть monitoring-стека: prometheus/grafana/cadvisor/loki.
  # Отдельная от app-сети — уменьшает поверхность атаки телеметрии.
  monitoring:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  events_media:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
