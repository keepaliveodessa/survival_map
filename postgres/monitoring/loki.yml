# Loki 3.x — single-binary режим (monitoring-профиль, см. docker-compose.yml).
# Хранение: filesystem /loki (volume loki_data), ретеншн 7д — синхронизирован
# с --storage.tsdb.retention.time=7d у prometheus.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  # Ретеншн честно применяется компактором; без retention_enabled старые
  # данные живут до заполнения диска.
  retention_period: 168h
  reject_old_samples: true
  reject_old_samples_max_age: 168h

compactor:
  working_directory: /loki/compactor
  # Честный retention: компактор удаляет чанки старше retention_period.
  # Для retention_enabled в Loki 3.x обязателен delete_request_store.
  retention_enabled: true
  delete_request_store: filesystem
